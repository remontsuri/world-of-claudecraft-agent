name: agent-runtime-fix

on:
  workflow_dispatch:
  push:
    branches: [backup]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'remontsuri' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup
          fetch-depth: 0

      - name: Patch navigation clock and quest fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # P0: navigateToCoord must advance the real 20 Hz sim between samples.
          p = Path('src/bridge/actions.cjs')
          s = p.read_text()
          start = s.index('async function navigateToCoord')
          end = s.index('\n// Sustained walk:', start)
          body = s[start:end]
          old = "    if (st) lastPos = { x: st.x, z: st.z };\n  }\n  if (!arrived) {"
          new = "    if (st) lastPos = { x: st.x, z: st.z };\n    // Navigation samples must be separated by a real simulation tick. Without\n    // this, repeated CDP evaluations observe the same physics state and the\n    // controller burns maxSteps without moving the browser simulation.\n    await sleep(gameClient.tickMs);\n  }\n  if (!arrived) {"
          if 'await sleep(gameClient.tickMs);' not in body:
              if old not in body:
                  raise SystemExit('navigation anchor not found')
              s = s[:start] + body.replace(old, new, 1) + s[end:]
              p.write_text(s)

          # P0: fallback objectives must contribute to nObj even when both
          # questDefs and qp.counts are absent/empty.
          p = Path('src/bridge/snapshot.cjs')
          s = p.read_text()
          old = """      const nObj = Math.max((qp.counts || []).length, (def && Array.isArray(def.objectives)) ? def.objectives.length : 0);\n      const objs = [];\n      const fallback = QUEST_OBJECTIVES[qid] || null;"""
          new = """      const fallback = QUEST_OBJECTIVES[qid] || null;\n      const nObj = Math.max(\n        (qp.counts || []).length,\n        (fallback && fallback.length) || 0,\n        (def && Array.isArray(def.objectives)) ? def.objectives.length : 0,\n      );\n      const objs = [];"""
          if old not in s:
              raise SystemExit('quest fallback anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > python/test_agent_runtime_regression.py <<'PY'
          from pathlib import Path

          def test_navigation_waits_for_sim_tick():
              s = Path('src/bridge/actions.cjs').read_text()
              start = s.index('async function navigateToCoord')
              end = s.index('\n// Sustained walk:', start)
              body = s[start:end]
              assert 'await sleep(gameClient.tickMs);' in body

          def test_quest_fallback_defines_objective_count_before_loop():
              s = Path('src/bridge/snapshot.cjs').read_text()
              marker = 'const fallback = QUEST_OBJECTIVES[qid] || null;'
              pos = s.index(marker)
              tail = s[pos:pos + 700]
              assert '(fallback && fallback.length) || 0' in tail
              assert 'const nObj = Math.max(' in tail
          PY
          python3 -m py_compile python/test_agent_runtime_regression.py
          python3 - <<'PY'
          import subprocess
          subprocess.run(['node', '--check', 'src/bridge/actions.cjs'], check=True)
          subprocess.run(['node', '--check', 'src/bridge/snapshot.cjs'], check=True)
          PY
          pytest -q python/test_agent_runtime_regression.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bridge/actions.cjs src/bridge/snapshot.cjs python/test_agent_runtime_regression.py .github/workflows/agent-runtime-fix.yml
          git commit -m 'fix(agent): restore navigation tick and quest objective fallback'
          git push origin backup

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/agent-runtime-fix.yml
          git commit -m 'chore(ci): remove temporary runtime patch workflow'
          git push origin backup
