name: one-shot-agent-fix

on:
  push:
    branches: [backup]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'remontsuri' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup
          fetch-depth: 0

      - name: Apply runtime fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Restore the simulation tick that was removed by dfe751b.
          p = Path('src/bridge/actions.cjs')
          s = p.read_text()
          needle = "    if (st) lastPos = { x: st.x, z: st.z };\n  }\n  if (!arrived) {"
          replacement = "    if (st) lastPos = { x: st.x, z: st.z };\n    // One real sim tick between navigation samples. A tight CDP loop can\n    // repeatedly observe the same position and exhaust maxSteps without\n    // advancing the 20 Hz browser simulation.\n    await sleep(gameClient.tickMs);\n  }\n  if (!arrived) {"
          if 'await sleep(gameClient.tickMs);' not in s[s.find('async function navigateToCoord'):s.find('async function navigateToCoord')+20000]:
              if needle not in s:
                  raise SystemExit('navigation patch anchor not found')
              s = s.replace(needle, replacement, 1)
              p.write_text(s)

          # 2) Make the quest-objective fallback actually work when questDefs is
          # absent and qp.counts is empty. The fallback length must participate
          # in nObj, and it must be defined before nObj.
          p = Path('src/bridge/snapshot.cjs')
          s = p.read_text()
          old = """      const nObj = Math.max((qp.counts || []).length, (def && Array.isArray(def.objectives)) ? def.objectives.length : 0);\n      const objs = [];\n      const fallback = QUEST_OBJECTIVES[qid] || null;"""
          new = """      const fallback = QUEST_OBJECTIVES[qid] || null;\n      const nObj = Math.max(\n        (qp.counts || []).length,\n        (fallback && fallback.length) || 0,\n        (def && Array.isArray(def.objectives)) ? def.objectives.length : 0,\n      );\n      const objs = [];"""
          if old not in s:
              raise SystemExit('quest fallback patch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > python/test_navigation_regression.py <<'PY'
          import ast
          from pathlib import Path

          def test_navigation_keeps_a_sim_tick_between_samples():
              s = Path('src/bridge/actions.cjs').read_text()
              start = s.index('async function navigateToCoord')
              end = s.index('\nasync ', start + 10) if '\nasync ' in s[start + 10:] else len(s)
              body = s[start:end]
              assert 'await sleep(gameClient.tickMs);' in body

          def test_snapshot_fallback_contributes_objective_count():
              s = Path('src/bridge/snapshot.cjs').read_text()
              assert '(fallback && fallback.length) || 0' in s
          PY

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-agent-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bridge/actions.cjs src/bridge/snapshot.cjs python/test_navigation_regression.py .github/workflows/one-shot-agent-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(agent): restore sim tick and make quest fallback effective'
          git push origin backup
